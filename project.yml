name: AIReceiptApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AIReceiptApp:
    type: application
    platform: iOS
    sources:
      - path: AIReceiptApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIReceiptApp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AI Receipt"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts to add expenses automatically."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import receipt photos from your library."

  AIReceiptAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIReceiptAppTests
    dependencies:
      - target: AIReceiptApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIReceiptAppTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIReceiptApp:
    build:
      targets:
        AIReceiptApp: all
        AIReceiptAppTests: [test]
    test:
      targets:
        - AIReceiptAppTests
    run:
      config: Debug
