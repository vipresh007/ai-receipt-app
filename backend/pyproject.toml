[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-receipt-backend"
version = "0.1.0"
description = "FastAPI backend for AI Receipt — receipt extraction, receipts, expenses, budgets."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "httpx[http2]>=0.27",  # http2: APNs (services/push.py)
    "openai>=1.50,<4",
    "azure-storage-blob[aio]>=12.20",  # [aio]: aiohttp, which the async client needs
    "azure-communication-email>=1.0",
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # 2.15+: earlier releases carry token-verification advisories (PYSEC-2026-41xx).
    "pyjwt[crypto]>=2.15",
    # PDF receipts/invoices → an image + their text (services/pdf.py).
    "pypdfium2>=4.30",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx[http2]>=0.27",  # http2: APNs (services/push.py)
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI uses Depends(...) as default argument values

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
