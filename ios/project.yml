name: AIReceiptApp

options:
  bundleIdPrefix: com.vipreshpatel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "253QMGHP88"
    CODE_SIGN_STYLE: Automatic

packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: "3.1.0"

targets:
  AIReceiptApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/AIReceiptApp.xcconfig
      Release: Config/AIReceiptApp.xcconfig
    sources:
      - path: AIReceiptApp
    dependencies:
      - package: Auth0
        product: Auth0
    info:
      path: AIReceiptApp/Generated/Info.plist
      properties:
        CFBundleDisplayName: Tally
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        NSCameraUsageDescription: "Tally uses the camera so you can snap a receipt and have its details filled in for you."
        NSPhotoLibraryUsageDescription: "Tally reads a receipt photo you pick from your library to fill in the expense."
        ExtractionAPIHost: $(EXTRACTION_API_HOST)
        Auth0Domain: $(AUTH0_DOMAIN)
        Auth0ClientId: $(AUTH0_CLIENT_ID)
        Auth0Audience: $(AUTH0_AUDIENCE)
        # Auth0 redirects back to the app through this custom scheme. Must match
        # the Native app's Allowed Callback URLs in the Auth0 dashboard.
        CFBundleURLTypes:
          - CFBundleTypeRole: None
            CFBundleURLName: auth0
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        # Allow plain-HTTP only to localhost / *.local for local backend dev.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vipreshpatel.tally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  AIReceiptAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIReceiptAppTests
    dependencies:
      - target: AIReceiptApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vipreshpatel.tally.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIReceiptApp:
    build:
      targets:
        AIReceiptApp: all
        AIReceiptAppTests: [test]
    test:
      targets:
        - AIReceiptAppTests
    run:
      config: Debug
