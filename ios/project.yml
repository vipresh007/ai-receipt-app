name: AIReceiptApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AIReceiptApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/AIReceiptApp.xcconfig
      Release: Config/AIReceiptApp.xcconfig
    sources:
      - path: AIReceiptApp
    info:
      path: AIReceiptApp/Generated/Info.plist
      properties:
        CFBundleDisplayName: AI Receipt
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scan receipts to add expenses automatically."
        NSPhotoLibraryUsageDescription: "Import receipt photos from your library."
        ExtractionAPIHost: $(EXTRACTION_API_HOST)
        # Allow plain-HTTP only to localhost / *.local for local backend dev.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIReceiptApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  AIReceiptAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIReceiptAppTests
    dependencies:
      - target: AIReceiptApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIReceiptAppTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIReceiptApp:
    build:
      targets:
        AIReceiptApp: all
        AIReceiptAppTests: [test]
    test:
      targets:
        - AIReceiptAppTests
    run:
      config: Debug
