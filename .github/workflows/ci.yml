name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'design/**'
              - '.github/workflows/ci.yml'

  ios:
    name: iOS — build & test
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          echo "/tmp/xg/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ios/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/**/*.swift') }}
          restore-keys: dd-${{ runner.os }}-

      - name: Select a simulator
        id: sim
        run: |
          list_udid() { xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS" in k for x in v if x.get("isAvailable")]; ip=[x for x in c if "iPhone" in x["name"]] or c; print(ip[-1]["udid"] if ip else "")'; }
          udid=$(list_udid)
          if [ -z "$udid" ]; then xcodebuild -downloadPlatform iOS -quiet || true; udid=$(list_udid); fi
          [ -n "$udid" ] || { echo "::error::no iOS simulator available"; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test -quiet \
            -project AIReceiptApp.xcodeproj \
            -scheme AIReceiptApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore

  backend:
    name: Backend — lint & test
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  web:
    name: Web — lint & build
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
